name: PR Check

on:
  pull_request:
    branches:
      - local
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # local 的 PR 必需检查名称保持稳定；如设置分支规则，请将此 job 名称列为必需检查
    name: Lint / Test / Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      # 仅测试合入 local 的候选代码；不会读取 Release 签名 Secrets
      # 提交号取 PR 头部提交，而非 GitHub 生成的临时合并提交
      - name: Lint、单元测试与 Debug 构建
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          "-Peta.buildMetadata=${HEAD_SHA::7}"
          :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

name: Image Zoom Touch Fix Test APK

# Temporary touch-fix device test. Do not merge this workflow into local.
# Secrets are never exposed to the source build step: only a downloaded APK is signed.
on:
  push:
    branches:
      - fix/image-zoom-touch-anchor

permissions:
  contents: read

concurrency:
  group: image-zoom-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-release:
    name: Build isolated unsigned release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout test commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Standard Eta Android build toolchain
        uses: ./.github/actions/setup-build

      - name: Build unsigned test release (no signing secrets)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache \
            "-Peta.buildMetadata=test-${GITHUB_SHA::7}" :app:testDebugUnitTest :app:assembleRelease

      - name: Upload unsigned APK for isolated signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-image-zoom-apk
          path: app/build/outputs/apk/release/Eta-v*.apk
          if-no-files-found: error
          retention-days: 1

  sign-and-publish-test:
    name: Sign & upload installable test APK
    needs: unsigned-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No checkout, build scripts, app code, or Gradle execution in this signing job.
      - name: Set up Android signing tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Download unsigned APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-image-zoom-apk
          path: ${{ runner.temp }}/unsigned

      - name: Align, sign with existing release certificate, verify
        shell: bash
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" || -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" || -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Missing existing release signing secrets"
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eta-test.jks"
          chmod 600 "$RUNNER_TEMP/eta-test.jks"
          shopt -s nullglob
          apks=("$RUNNER_TEMP"/unsigned/Eta-v*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one unsigned release APK"
            exit 1
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ ! -x "$build_tools/zipalign" || ! -x "$build_tools/apksigner" ]]; then
            echo "::error::Missing Android SDK zipalign/apksigner"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signed"
          "$build_tools/zipalign" -f -p 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          out="$RUNNER_TEMP/signed/$(basename "${apks[0]}")"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/eta-test.jks" \
            --ks-key-alias "$ETA_RELEASE_KEY_ALIAS" \
            --ks-pass env:ETA_RELEASE_STORE_PASSWORD \
            --key-pass env:ETA_RELEASE_KEY_PASSWORD \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --print-certs "$out"
          "$build_tools/zipalign" -c -p 4 "$out"
          sha256sum "$out"
          rm -f "$RUNNER_TEMP/eta-test.jks"

      - name: Downloadable same-signature image-zoom test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Eta-image-zoom-touchfix-installable-${{ github.sha }}
          path: ${{ runner.temp }}/signed/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

Host eta-pc
    HostName 100.122.92.56
    HostKeyAlias eta-pc
    User bian
    Port 22
    IdentityFile ~/.ssh/id_ed25519_eta_pc
    IdentitiesOnly yes
    BatchMode yes
    StrictHostKeyChecking yes
    ProxyCommand /root/.local/share/eta-tailscale/bin/tailscale --socket=/root/.local/share/eta-tailscale/tailscaled.sock nc %h %p
    ServerAliveInterval 30
    ServerAliveCountMax 3
    TCPKeepAlive yes
    ControlMaster no
    ControlPath none
    ControlPersist no

Host eta-phone
    HostName 127.0.0.1
    Port 2222
    User root
    IdentityFile ~/.ssh/id_ed25519_eta_phone
    IdentitiesOnly yes
    BatchMode yes
    HostKeyAlias eta-phone
    StrictHostKeyChecking yes
    UserKnownHostsFile ~/.ssh/known_hosts_eta_phone
    ServerAliveInterval 30
    ServerAliveCountMax 3
    ConnectTimeout 15
